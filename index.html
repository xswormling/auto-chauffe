
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<title>Auto-Chauffe D2a-1 iPhone</title>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<style>
:root{--primary:#007aff;--bg:#f2f2f7;--card:#fff;--border:#dcdce0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg)}
header{background:var(--primary);color:#fff;padding:18px;text-align:center;position:sticky;top:0}
main{max-width:1000px;margin:auto;padding:12px}
section{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.btn,input[type=file]{width:100%;min-height:52px;border-radius:12px;margin-top:8px}
.btn{border:none;background:var(--primary);color:#fff}
.btn:disabled{background:#aaa}
#osmdOriginal,#osmdTransposed{width:100%;overflow-x:auto;border:1px solid var(--border);padding:8px;border-radius:12px;background:white;-webkit-overflow-scrolling:touch}
#osmdOriginal svg,#osmdTransposed svg{width:100%!important;height:auto!important}
.log{white-space:pre-wrap;font-family:monospace}
</style>
</head><body>
<header><h1>🎵 Auto‑Chauffe D2a‑1</h1></header>
<main>
<section><input type="file" id="xmlInput" accept=".musicxml,.xml"><div id="fileInfo"></div><div id="osmdOriginal"></div></section>
<section><button id="startAudioBtn" class="btn">🎤 Démarrer l'écoute</button><button id="stopAudioBtn" class="btn" disabled>🛑 Arrêter</button><div id="audioStatus"></div><div id="noteInfo"></div><div id="intervalInfo"></div></section>
<section><button id="transposeBtn" class="btn" disabled>🎼 Transposer</button><div id="resultInfo"></div><div id="osmdTransposed"></div></section>
<section><div id="log" class="log"></div></section>
</main>
<script>
const logDiv=document.getElementById('log');
function log(m){logDiv.textContent+=m+'\n';}
let osmdOriginal=null,osmdTransposed=null,xmlContent=null,firstNoteMidi=null,playedNote=null,interval=0;
async function renderScore(id,xml){const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(id,{autoResize:true,drawingParameters:'compacttight'});await osmd.load(xml);osmd.Zoom=window.innerWidth<700?0.55:0.9;osmd.render();return osmd;}
function midiFromNote(s,a,o){const v={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return 12*(o+1)+v[s]+a}
function noteFromMidi(m){const n=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const x=n[m%12];return{step:x[0],alter:x.includes('#')?1:0,octave:Math.floor(m/12)-1}}
xmlInput.onchange=()=>{const f=xmlInput.files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{xmlContent=e.target.result;fileInfo.textContent='Partition chargée : '+f.name;const xml=new DOMParser().parseFromString(xmlContent,'application/xml');const p=xml.querySelector('note pitch');if(p){firstNoteMidi=midiFromNote(p.querySelector('step').textContent,p.querySelector('alter')?parseInt(p.querySelector('alter').textContent):0,parseInt(p.querySelector('octave').textContent));}osmdOriginal=await renderScore('osmdOriginal',xmlContent);};r.readAsText(f);};
window.addEventListener('resize',async()=>{if(xmlContent)osmdOriginal=await renderScore('osmdOriginal',xmlContent);});
let audioContext,analyser,mediaStream,audioInterval;
function autoCorrelate(buffer,sampleRate){let SIZE=buffer.length,rms=0;for(let i=0;i<SIZE;i++)rms+=buffer[i]*buffer[i];rms=Math.sqrt(rms/SIZE);if(rms<0.01)return-1;let c=new Array(SIZE).fill(0);for(let i=0;i<SIZE;i++){for(let j=0;j<SIZE-i;j++)c[i]+=buffer[j]*buffer[j+i]}let d=0;while(c[d]>c[d+1])d++;let max=-1,pos=-1;for(let i=d;i<SIZE;i++){if(c[i]>max){max=c[i];pos=i}}return sampleRate/pos;}
function freqToNoteName(freq){const midi=Math.round(69+12*Math.log2(freq/440));const note=noteFromMidi(midi);return{midi,display:note.step+(note.alter? '#':'')+note.octave};}
startAudioBtn.onclick=async()=>{audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')await audioContext.resume();mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});const source=audioContext.createMediaStreamSource(mediaStream);analyser=audioContext.createAnalyser();analyser.fftSize=2048;source.connect(analyser);audioStatus.textContent='Écoute en cours';startAudioBtn.disabled=true;stopAudioBtn.disabled=false;const buffer=new Float32Array(analyser.fftSize);audioInterval=setInterval(()=>{analyser.getFloatTimeDomainData(buffer);const freq=autoCorrelate(buffer,audioContext.sampleRate);if(freq>0){const d=freqToNoteName(freq);playedNote=d.display;noteInfo.textContent='Note détectée : '+playedNote;if(firstNoteMidi!==null){interval=d.midi-firstNoteMidi;intervalInfo.textContent='Intervalle : '+(interval>=0?'+':'')+interval+' demi-tons';transposeBtn.disabled=false;}}},200);};
stopAudioBtn.onclick=()=>{if(audioInterval)clearInterval(audioInterval);if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());if(audioContext)audioContext.close();};
transposeBtn.onclick=async()=>{const xmlDoc=new DOMParser().parseFromString(xmlContent,'application/xml');const notes=xmlDoc.querySelectorAll('note');const order=['C','D','E','F','G','A','B'];const firstStep=noteFromMidi(firstNoteMidi).step;const playedStep=playedNote[0];let d=order.indexOf(playedStep)-order.indexOf(firstStep);if(d<0)d+=7;notes.forEach(note=>{const pitch=note.querySelector('pitch');if(!pitch)return;const step=pitch.querySelector('step').textContent;const octave=parseInt(pitch.querySelector('octave').textContent);const alterNode=pitch.querySelector('alter');const alter=alterNode?parseInt(alterNode.textContent):0;const midiOld=midiFromNote(step,alter,octave);const midiTarget=midiOld+interval;const newStep=order[(order.indexOf(step)+d)%7];let bestOct=octave,bestDiff=1e9;for(let o=octave-1;o<=octave+1;o++){let diff=Math.abs(midiFromNote(newStep,0,o)-midiTarget);if(diff<bestDiff){bestDiff=diff;bestOct=o;}}const base=midiFromNote(newStep,0,bestOct);let newAlter=midiTarget-base;pitch.querySelector('step').textContent=newStep;pitch.querySelector('octave').textContent=bestOct;if(newAlter!==0){if(!alterNode){const n=xmlDoc.createElement('alter');n.textContent=newAlter;pitch.appendChild(n);}else alterNode.textContent=newAlter;}else if(alterNode)alterNode.remove();});const xmlT=new XMLSerializer().serializeToString(xmlDoc);osmdTransposed=await renderScore('osmdTransposed',xmlT);resultInfo.textContent='✅ Transposition D2a‑1 effectuée';};
</script></body></html>

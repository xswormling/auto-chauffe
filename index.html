<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#007aff" />
  <title>Auto-Chauffe D2a-1 iPhone</title>
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card: #fff;
      --border: #dcdce0;
      --text: #1c1c1e;
      --muted: #666;
      --danger: #d93025;
      --success: #34c759;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 12px;
    }

    section {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }

    .btn, input[type="file"] {
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      margin-top: 8px;
      font-size: 1rem;
    }

    .btn {
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      padding: 0 12px;
    }

    .btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary {
      background: #f0f0f0;
      color: var(--text);
    }

    #osmdOriginal, #osmdTransposed {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 12px;
      background: white;
      -webkit-overflow-scrolling: touch;
      min-height: 180px;
    }

    #osmdOriginal svg, #osmdTransposed svg {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    .status {
      margin-top: 8px;
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    .log {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: #333;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 10px;
      min-height: 120px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Auto‑Chauffe D2a‑1</h1>
  </header>

  <main>
    <section>
      <input type="file" id="xmlInput" accept=".musicxml,.xml" />
      <div id="fileInfo" class="status"></div>
      <div id="osmdOriginal"></div>
    </section>

    <section>
      <button id="startAudioBtn" class="btn">🎤 Démarrer l'écoute</button>
      <button id="stopAudioBtn" class="btn" disabled>🛑 Arrêter</button>
      <div id="audioStatus" class="status"></div>
      <div id="noteInfo" class="status"></div>
    </section>

    <section>
      <button id="transposeBtn" class="btn" disabled>🎼 Transposer</button>
      <div id="resultInfo" class="status"></div>
      <div id="osmdTransposed"></div>
    </section>

    <section>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script>
    const logDiv = document.getElementById('log');
    const fileInfo = document.getElementById('fileInfo');
    const audioStatus = document.getElementById('audioStatus');
    const noteInfo = document.getElementById('noteInfo');
    const resultInfo = document.getElementById('resultInfo');
    const xmlInput = document.getElementById('xmlInput');
    const startAudioBtn = document.getElementById('startAudioBtn');
    const stopAudioBtn = document.getElementById('stopAudioBtn');
    const transposeBtn = document.getElementById('transposeBtn');

    let osmdOriginal = null;
    let osmdTransposed = null;
    let xmlContent = null;
    let firstNoteMidi = null;
    let playedNote = null;
    let audioContext = null;
    let analyser = null;
    let mediaStream = null;
    let audioInterval = null;

    function setStatus(el, text, type = '') {
      el.textContent = text;
      el.className = 'status';
      if (type) el.classList.add(type);
    }

    function log(message) {
      logDiv.textContent += (message || '') + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function midiFromNote(step, alter, octave) {
      const map = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const base = map[step];
      if (base === undefined) return null;
      return (octave + 1) * 12 + base + alter;
    }

    function noteFromMidi(midi) {
      const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const step = names[midi % 12];
      const note = {
        step: step[0],
        alter: step.includes('#') ? 1 : 0,
        octave: Math.floor(midi / 12) - 1
      };
      return note;
    }

    function midiToDisplayName(midi) {
      const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const name = names[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return name + octave;
    }

    function noteNameFromFrequency(freq) {
      if (!Number.isFinite(freq) || freq <= 0) return null;
      const midi = Math.round(69 + 12 * Math.log2(freq / 440));
      return {
        midi,
        display: midiToDisplayName(midi)
      };
    }

    function getNearestMidi(freq) {
      if (!Number.isFinite(freq) || freq <= 0) return null;
      return Math.round(69 + 12 * Math.log2(freq / 440));
    }

    function autoCorrelate(buffer, sampleRate) {
      const SIZE = buffer.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) {
        const val = buffer[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;

      let bestOffset = -1;
      let bestCorrelation = 0;
      const maxSamples = Math.floor(SIZE / 2);

      for (let offset = 1; offset < maxSamples; offset++) {
        let correlation = 0;
        for (let i = 0; i < maxSamples; i++) {
          const a = buffer[i];
          const b = buffer[i + offset];
          correlation += (a * b);
        }
        correlation /= maxSamples;
        if (correlation > bestCorrelation) {
          bestCorrelation = correlation;
          bestOffset = offset;
        }
      }

      if (bestOffset <= 0) return -1;

      const freq = sampleRate / bestOffset;
      return freq;
    }

    async function renderScore(containerId, xml) {
      const container = document.getElementById(containerId);
      if (!container) return null;

      try {
        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(containerId, {
          autoResize: true,
          drawingParameters: 'compacttight'
        });

        await osmd.load(xml);
        osmd.Zoom = Math.min(1.6, window.innerWidth < 700 ? 0.9 : 1.2);
        return osmd;
      } catch (err) {
        console.error('renderScore error:', err);
        setStatus(fileInfo, 'Erreur de rendu de la partition.', 'error');
        return null;
      }
    }

    function resetAudioState() {
      if (audioInterval) {
        clearInterval(audioInterval);
        audioInterval = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        try {
          audioContext.close();
        } catch (e) {}
      }
      audioContext = null;
      analyser = null;
    }

    async function startListening() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus(audioStatus, 'Votre navigateur ne supporte pas l’entrée microphone.', 'error');
        return;
      }

      try {
        resetAudioState();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        const source = audioContext.createMediaStreamSource(mediaStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.2;
        source.connect(analyser);

        startAudioBtn.disabled = true;
        stopAudioBtn.disabled = false;
        setStatus(audioStatus, 'Écoute active…', 'ok');

        audioInterval = setInterval(() => {
          try {
            const bufferLength = analyser.fftSize;
            const dataArray = new Float32Array(bufferLength);
            analyser.getFloatTimeDomainData(dataArray);

            const freq = autoCorrelate(dataArray, audioContext.sampleRate);
            if (freq > 0 && freq < 20000) {
              const note = noteNameFromFrequency(freq);
              if (note) {
                playedNote = note.midi;
                noteInfo.textContent = `Note détectée : ${note.display} (${freq.toFixed(1)} Hz)`;
              }
            } else {
              noteInfo.textContent = 'Aucune note stable détectée';
            }
          } catch (err) {
            console.error('Audio interval error:', err);
            setStatus(audioStatus, 'Erreur de détection audio.', 'error');
          }
        }, 120);
      } catch (err) {
        console.error('startListening error:', err);
        setStatus(audioStatus, 'Accès au microphone refusé ou indisponible.', 'error');
        resetAudioState();
        startAudioBtn.disabled = false;
        stopAudioBtn.disabled = true;
      }
    }

    function stopListening() {
      resetAudioState();
      startAudioBtn.disabled = false;
      stopAudioBtn.disabled = true;
      setStatus(audioStatus, 'Écoute arrêtée.', '');
      noteInfo.textContent = '';
    }

    function parseMidiPitchFromMusicXML(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
      const parserError = xmlDoc.querySelector('parsererror');
      if (parserError) {
        throw new Error('Fichier MusicXML invalide.');
      }

      const notes = Array.from(xmlDoc.querySelectorAll('note'));
      const pitchData = [];

      for (const noteEl of notes) {
        const restEl = noteEl.querySelector('rest');
        if (restEl) continue;

        const pitchEl = noteEl.querySelector('pitch');
        if (!pitchEl) continue;

        const stepEl = pitchEl.querySelector('step');
        const alterEl = pitchEl.querySelector('alter');
        const octaveEl = pitchEl.querySelector('octave');

        if (!stepEl || !octaveEl) continue;

        const step = stepEl.textContent.trim();
        const alter = alterEl ? Number(alterEl.textContent.trim() || 0) : 0;
        const octave = Number(octaveEl.textContent.trim());

        const midi = midiFromNote(step, alter, octave);
        if (midi !== null) {
          pitchData.push(midi);
        }
      }

      return pitchData;
    }

    function transposeMusicXML(xmlText, semitones) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
      const parserError = xmlDoc.querySelector('parsererror');
      if (parserError) {
        throw new Error('Le fichier XML n’est pas valide.');
      }

      const noteEls = xmlDoc.querySelectorAll('note');

      for (const noteEl of noteEls) {
        const restEl = noteEl.querySelector('rest');
        if (restEl) continue;

        const pitchEl = noteEl.querySelector('pitch');
        if (!pitchEl) continue;

        const stepEl = pitchEl.querySelector('step');
        const alterEl = pitchEl.querySelector('alter');
        const octaveEl = pitchEl.querySelector('octave');

        if (!stepEl || !octaveEl) continue;

        const step = stepEl.textContent.trim();
        const alter = alterEl ? Number(alterEl.textContent.trim() || 0) : 0;
        const octave = Number(octaveEl.textContent.trim());

        const originalMidi = midiFromNote(step, alter, octave);
        if (originalMidi === null) continue;

        const transposedMidi = originalMidi + semitones;
        const transposed = noteFromMidi(transposedMidi);

        if (!transposed) continue;

        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const newStep = names[transposedMidi % 12];
        const newAlter = newStep.includes('#') ? 1 : 0;

        stepEl.textContent = newStep[0];
        if (newAlter) {
          if (!alterEl) {
            const newAlterEl = xmlDoc.createElement('alter');
            newAlterEl.textContent = '1';
            pitchEl.appendChild(newAlterEl);
          } else {
            alterEl.textContent = '1';
          }
        } else {
          if (alterEl) {
            alterEl.textContent = '0';
          }
        }

        octaveEl.textContent = String(Math.floor(transposedMidi / 12) - 1);
      }

      return new XMLSerializer().serializeToString(xmlDoc);
    }

    function getFirstNoteMidi(noteList) {
      if (!noteList.length) return null;
      const sorted = [...noteList].sort((a, b) => a - b);
      return sorted[0];
    }

    xmlInput.addEventListener('change', async () => {
      const file = xmlInput.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        xmlContent = text;
        fileInfo.textContent = `Partition chargée : ${file.name}`;

        if (typeof opensheetmusicdisplay !== 'undefined') {
          osmdOriginal = await renderScore('osmdOriginal', xmlContent);
          if (osmdOriginal) {
            setStatus(fileInfo, `Partition chargée : ${file.name}`, 'ok');
          }
        }

        const melody = parseMidiPitchFromMusicXML(xmlContent);
        if (melody.length) {
          firstNoteMidi = getFirstNoteMidi(melody);
          const firstName = midiToDisplayName(firstNoteMidi);
          log(`Première note détectée dans la partition : ${firstName}`);
          transposeBtn.disabled = false;
        } else {
          firstNoteMidi = null;
          transposeBtn.disabled = true;
          log('Aucune note de hauteur trouvée dans le fichier XML.');
          setStatus(fileInfo, `Partition chargée : ${file.name} (aucune note détectée)`, 'error');
        }
      } catch (err) {
        console.error('XML load error:', err);
        xmlContent = null;
        transposeBtn.disabled = true;
        setStatus(fileInfo, 'Impossible de lire la partition.', 'error');
        log('Erreur de lecture du fichier MusicXML.');
      }
    });

    startAudioBtn.addEventListener('click', startListening);
    stopAudioBtn.addEventListener('click', stopListening);

    transposeBtn.addEventListener('click', async () => {
      if (!xmlContent) {
        setStatus(resultInfo, 'Chargez d’abord une partition.', 'error');
        return;
      }

      if (playedNote === null || firstNoteMidi === null) {
        setStatus(resultInfo, 'Aucune note audio ou note de base détectée.', 'error');
        return;
      }

      const semitones = playedNote - firstNoteMidi;
      const transposedXml = transposeMusicXML(xmlContent, semitones);

      try {
        osmdTransposed = await renderScore('osmdTransposed', transposedXml);
        const label = `${semitones >= 0 ? '+' : ''}${semitones} demi-tons`;
        setStatus(resultInfo, `Transposition appliquée : ${label}`, 'ok');
        log(`Transposition appliquée : ${label}`);
      } catch (err) {
        console.error('Transpose error:', err);
        setStatus(resultInfo, 'La transposition a échoué.', 'error');
      }
    });

    window.addEventListener('resize', async () => {
      if (!xmlContent) return;
      try {
        osmdOriginal = await renderScore('osmdOriginal', xmlContent);
      } catch (err) {
        console.error('Resize render error:', err);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#007aff" />
  <title>Auto-Chauffe D2a-1 iPhone</title>
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card: #fff;
      --border: #dcdce0;
      --text: #1c1c1e;
      --muted: #666;
      --danger: #d93025;
      --success: #34c759;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 12px;
    }

    section {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }

    .btn, input[type="file"] {
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      margin-top: 8px;
      font-size: 1rem;
    }

    .btn {
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      padding: 0 12px;
      -webkit-appearance: none;
      appearance: none;
    }

    .btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #osmdOriginal, #osmdTransposed {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 12px;
      background: white;
      -webkit-overflow-scrolling: touch;
      min-height: 180px;
      touch-action: pan-x pan-y;
    }

    #osmdOriginal svg, #osmdTransposed svg {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    .status {
      margin-top: 8px;
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    .log {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: #333;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 10px;
      min-height: 120px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Auto‑Chauffe D2a‑1 .03</h1>
  </header>

  <main>
    <section>
      <input type="file" id="xmlInput" accept=".musicxml,.xml" />
      <div id="fileInfo" class="status"></div>
      <div id="osmdOriginal"></div>
    </section>

    <section>
      <button id="startAudioBtn" class="btn">🎤 Démarrer l'écoute</button>
      <button id="stopAudioBtn" class="btn" disabled>🛑 Arrêter</button>
      <div id="audioStatus" class="status"></div>
      <div id="noteInfo" class="status"></div>
    </section>

    <section>
      <button id="transposeBtn" class="btn" disabled>🎼 Transposer</button>
      <div id="resultInfo" class="status"></div>
      <div id="osmdTransposed"></div>
    </section>

    <section>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script>
    const logDiv = document.getElementById('log');
    const fileInfo = document.getElementById('fileInfo');
    const audioStatus = document.getElementById('audioStatus');
    const noteInfo = document.getElementById('noteInfo');
    const resultInfo = document.getElementById('resultInfo');
    const xmlInput = document.getElementById('xmlInput');
    const startAudioBtn = document.getElementById('startAudioBtn');
    const stopAudioBtn = document.getElementById('stopAudioBtn');
    const transposeBtn = document.getElementById('transposeBtn');

    let xmlContent = null;
    let firstNoteMidi = null;
    let playedNote = null;
    let audioContext = null;
    let analyser = null;
    let mediaStream = null;
    let audioInterval = null;
    let lastDetectedFrequency = null;
    let stablePitchSamples = [];

    function setStatus(el, text, type = '') {
      el.textContent = text;
      el.className = 'status';
      if (type) el.classList.add(type);
    }

    function log(message) {
      logDiv.textContent += (message || '') + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function toMidiFromPitch(step, alter, octave) {
      const map = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const base = map[step];
      if (base === undefined) return null;
      return (octave + 1) * 12 + base + alter;
    }

    function noteFromMidi(midi) {
      const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const name = names[midi % 12];
      return {
        step: name[0],
        alter: name.includes('#') ? 1 : 0,
        octave: Math.floor(midi / 12) - 1
      };
    }

    function midiToName(midi) {
      const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const name = names[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${name}${octave}`;
    }

    function noteFromFrequency(freq) {
      if (!Number.isFinite(freq) || freq <= 0) return null;
      const midi = Math.round(69 + 12 * Math.log2(freq / 440));
      return { midi, display: midiToName(midi) };
    }

    function getMedian(values) {
      if (!values.length) return null;
      const sorted = [...values].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 === 0
        ? (sorted[mid - 1] + sorted[mid]) / 2
        : sorted[mid];
    }

    function detectPitchFromFFT(analyser, sampleRate) {
      const freqData = new Float32Array(analyser.fftSize);
      analyser.getFloatFrequencyData(freqData);

      let maxValue = -Infinity;
      let dominantIndex = 0;

      const minFrequency = 80;
      const maxFrequency = 2000;

      const minBin = Math.max(0, Math.floor(minFrequency * analyser.fftSize / sampleRate));
      const maxBin = Math.min(freqData.length - 1, Math.ceil(maxFrequency * analyser.fftSize / sampleRate));

      for (let i = minBin; i <= maxBin; i++) {
        if (freqData[i] > maxValue) {
          maxValue = freqData[i];
          dominantIndex = i;
        }
      }

      // Silencio / pas de note
      if (maxValue > -55) {
        const binWidth = sampleRate / analyser.fftSize;
        let freq = dominantIndex * binWidth;

        // Quadratic interpolation around peak for better precision
        if (dominantIndex > 0 && dominantIndex < freqData.length - 1) {
          const prev = freqData[dominantIndex - 1];
          const curr = freqData[dominantIndex];
          const next = freqData[dominantIndex + 1];
          const denom = prev - 2 * curr + next;
          if (denom !== 0) {
            const delta = (prev - next) / (2 * denom);
            freq = (dominantIndex + delta) * binWidth;
          }
        }

        if (freq >= minFrequency && freq <= maxFrequency) {
          return freq;
        }
      }

      return null;
    }

    function renderScore(containerId, xml) {
      const container = document.getElementById(containerId);
      if (!container) return null;

      try {
        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(containerId, {
          autoResize: true,
          drawingParameters: 'compacttight'
        });

        return osmd.load(xml).then(() => {
          osmd.Zoom = Math.min(1.4, window.innerWidth < 700 ? 0.95 : 1.2);
          return osmd;
        });
      } catch (err) {
        console.error('renderScore error:', err);
        setStatus(fileInfo, 'Erreur de rendu de la partition.', 'error');
        return null;
      }
    }

    function stopAudio() {
      if (audioInterval) {
        clearInterval(audioInterval);
        audioInterval = null;
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      if (audioContext && audioContext.state !== 'closed') {
        try {
          audioContext.close();
        } catch (e) {}
      }

      audioContext = null;
      analyser = null;
      lastDetectedFrequency = null;
      stablePitchSamples = [];
      playedNote = null;

      startAudioBtn.disabled = false;
      stopAudioBtn.disabled = true;
      setStatus(audioStatus, 'Écoute arrêtée.', '');
      noteInfo.textContent = '';
    }

    async function startAudio() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus(audioStatus, 'Mic non supporté sur ce navigateur.', 'error');
        return;
      }

      try {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) {
          setStatus(audioStatus, 'Web Audio non supporté.', 'error');
          return;
        }

        audioContext = new AudioCtor();

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false
          }
        });

        mediaStream = stream;

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.2;
        source.connect(analyser);

        startAudioBtn.disabled = true;
        stopAudioBtn.disabled = false;
        setStatus(audioStatus, 'Écoute active…', 'ok');

        audioInterval = setInterval(() => {
          try {
            if (!analyser || !audioContext) return;

            const freq = detectPitchFromFFT(analyser, audioContext.sampleRate);

            if (freq && Number.isFinite(freq)) {
              lastDetectedFrequency = freq;
              stablePitchSamples.push(freq);

              if (stablePitchSamples.length > 12) {
                stablePitchSamples.shift();
              }

              const medianFreq = getMedian(stablePitchSamples);
              if (medianFreq !== null) {
                const note = noteFromFrequency(medianFreq);
                if (note) {
                  playedNote = note.midi;
                  noteInfo.textContent = `Note détectée : ${note.display} (${medianFreq.toFixed(1)} Hz)`;
                }
              }
            } else {
              noteInfo.textContent = 'Aucune note stable détectée';
            }
          } catch (err) {
            console.error('Audio detection error:', err);
            setStatus(audioStatus, 'Erreur de détection audio.', 'error');
          }
        }, 120);

      } catch (err) {
        console.error('startAudio error:', err);
        setStatus(audioStatus, 'Accès au microphone refusé ou indisponible.', 'error');
        stopAudio();
      }
    }

    function parsePitchDataFromMusicXML(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
      const parserError = xmlDoc.querySelector('parsererror');
      if (parserError) {
        throw new Error('Fichier MusicXML invalide.');
      }

      const noteEls = Array.from(xmlDoc.querySelectorAll('note'));
      const pitchData = [];

      for (const noteEl of noteEls) {
        const restEl = noteEl.querySelector('rest');
        if (restEl) continue;

        const pitchEl = noteEl.querySelector('pitch');
        if (!pitchEl) continue;

        const stepEl = pitchEl.querySelector('step');
        const alterEl = pitchEl.querySelector('alter');
        const octaveEl = pitchEl.querySelector('octave');

        if (!stepEl || !octaveEl) continue;

        const step = stepEl.textContent.trim();
        const alter = alterEl ? Number(alterEl.textContent.trim() || 0) : 0;
        const octave = Number(octaveEl.textContent.trim());

        const midi = toMidiFromPitch(step, alter, octave);
        if (midi !== null) pitchData.push(midi);
      }

      return pitchData;
    }

    function transposeMusicXML(xmlText, semitones) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
      const parserError = xmlDoc.querySelector('parsererror');
      if (parserError) {
        throw new Error('XML invalide');
      }

      const notes = xmlDoc.querySelectorAll('note');

      for (const noteEl of notes) {
        const rest = noteEl.querySelector('rest');
        if (rest) continue;

        const pitch = noteEl.querySelector('pitch');
        if (!pitch) continue;

        const stepEl = pitch.querySelector('step');
        const alterEl = pitch.querySelector('alter');
        const octaveEl = pitch.querySelector('octave');

        if (!stepEl || !octaveEl) continue;

        const step = stepEl.textContent.trim();
        const alter = alterEl ? Number(alterEl.textContent.trim() || 0) : 0;
        const octave = Number(octaveEl.textContent.trim());

        const midi = toMidiFromPitch(step, alter, octave);
        if (midi === null) continue;

        const transposedMidi = midi + semitones;
        const transposed = noteFromMidi(transposedMidi);

        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const newStepName = names[transposedMidi % 12];
        stepEl.textContent = newStepName[0];

        if (newStepName.includes('#')) {
          if (!alterEl) {
            const newAlterEl = xmlDoc.createElement('alter');
            newAlterEl.textContent = '1';
            pitch.appendChild(newAlterEl);
          } else {
            alterEl.textContent = '1';
          }
        } else {
          if (alterEl) {
            alterEl.textContent = '0';
          }
        }

        octaveEl.textContent = String(Math.floor(transposedMidi / 12) - 1);
      }

      return new XMLSerializer().serializeToString(xmlDoc);
    }

    function getLowestMidiValue(values) {
      if (!values.length) return null;
      return [...values].sort((a, b) => a - b)[0];
    }

    xmlInput.addEventListener('change', async () => {
      const file = xmlInput.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        xmlContent = text;

        setStatus(fileInfo, `Partition chargée : ${file.name}`, 'ok');
        log(`Fichier chargé : ${file.name}`);

        renderScore('osmdOriginal', xmlContent)
          .then(() => {
            log('Partition originale rendue.');
          })
          .catch(err => {
            console.error(err);
            setStatus(fileInfo, 'Erreur de rendu de la partition.', 'error');
          });

        const pitchData = parsePitchDataFromMusicXML(xmlContent);
        if (pitchData.length) {
          firstNoteMidi = getLowestMidiValue(pitchData);
          transposeBtn.disabled = false;
          log(`Première note estimée de la partition : ${midiToName(firstNoteMidi)}`);
        } else {
          firstNoteMidi = null;
          transposeBtn.disabled = true;
          log('Aucune note trouvée dans le MusicXML.');
          setStatus(fileInfo, 'Partition chargée, mais aucune note détectée.', 'error');
        }

      } catch (err) {
        console.error('File read error:', err);
        xmlContent = null;
        transposeBtn.disabled = true;
        setStatus(fileInfo, 'Impossible de lire la partition.', 'error');
        log('Erreur de lecture du fichier.');
      }
    });

    startAudioBtn.addEventListener('click', () => {
      startAudio();
    });

    stopAudioBtn.addEventListener('click', () => {
      stopAudio();
    });

    transposeBtn.addEventListener('click', async () => {
      if (!xmlContent) {
        setStatus(resultInfo, 'Chargez d’abord une partition.', 'error');
        return;
      }

      if (firstNoteMidi === null || playedNote === null) {
        setStatus(resultInfo, 'Aucune note naturelle détectée pour transposer.', 'error');
        return;
      }

      const semitones = playedNote - firstNoteMidi;
      const transposedXml = transposeMusicXML(xmlContent, semitones);

      try {
        await renderScore('osmdTransposed', transposedXml);
        const label = `${semitones >= 0 ? '+' : ''}${semitones} demi-tons`;
        setStatus(resultInfo, `Transposition appliquée : ${label}`, 'ok');
        log(`Transposition appliquée : ${label}`);
      } catch (err) {
        console.error('Transpose failed:', err);
        setStatus(resultInfo, 'La transposition a échoué.', 'error');
      }
    });

    window.addEventListener('resize', () => {
      if (!xmlContent) return;
      clearTimeout(window.__renderTimeout);
      window.__renderTimeout = setTimeout(async () => {
        try {
          await renderScore('osmdOriginal', xmlContent);
        } catch (err) {
          console.error('Resize render failed:', err);
        }
      }, 250);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<title>Auto-Chauffe Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<style>
:root{--primary:#007aff;--bg:#f2f2f7;--card:#fff;--border:#dcdce0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg)}
header{background:var(--primary);color:#fff;padding:18px;text-align:center;position:sticky;top:0}
main{max-width:1000px;margin:auto;padding:12px}section{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.btn,input[type=file]{width:100%;min-height:52px;border-radius:12px;margin-top:8px}
.btn{border:none;background:var(--primary);color:#fff}
#osmdOriginal,#osmdTransposed{width:100%;overflow-x:auto;border:1px solid var(--border);padding:8px;border-radius:12px;background:white;-webkit-overflow-scrolling:touch}
#osmdOriginal svg,#osmdTransposed svg{width:100%!important;height:auto!important}.log{white-space:pre-wrap;font-family:monospace}
</style></head><body>
<header><h1>🎵 Auto‑Chauffe</h1></header>
<main>
<section><input type="file" id="xmlInput" accept=".musicxml,.xml"><div id="fileInfo"></div><div id="osmdOriginal"></div></section>
<section><button id="startAudioBtn" class="btn">🎤 Démarrer l'écoute</button><button id="stopAudioBtn" class="btn" disabled>🛑 Arrêter</button><div id="audioStatus"></div><div id="noteInfo"></div><div id="intervalInfo"></div></section>
<section><button id="transposeBtn" class="btn" disabled>🎼 Transposer</button><div id="resultInfo"></div><div id="osmdTransposed"></div></section>
<section><div id="log" class="log"></div></section>
</main>
<script>
function log(m){document.getElementById('log').textContent+=m+'\n'};
let osmdOriginal=null, xmlContent=null;
async function renderScore(id,xml){const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(id,{autoResize:true,drawingParameters:'compacttight'});await osmd.load(xml);osmd.Zoom=window.innerWidth<700?0.55:0.9;osmd.render();return osmd;}
xmlInput.onchange=()=>{const f=xmlInput.files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{xmlContent=e.target.result;fileInfo.textContent='Partition chargée : '+f.name;document.getElementById('osmdOriginal').innerHTML='';osmdOriginal=await renderScore('osmdOriginal',xmlContent);};r.readAsText(f);};
window.addEventListener('resize',async()=>{if(xmlContent){document.getElementById('osmdOriginal').innerHTML='';osmdOriginal=await renderScore('osmdOriginal',xmlContent);}});
</script></body></html>

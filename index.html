<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff6b6b" />
    <title>Auto‑Chauffe — Version Rigolote v14</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
    <style>
      :root {
        --bg: linear-gradient(135deg,#ffd3b6 0%, #ffc3a0 25%, #ffb4a2 50%, #ff9a9e 100%);
        --card: #fff;
        --accent: #ff6b6b;
        --accent-2: #ffb86b;
        --muted: #6b6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        min-height: 100vh;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      header {
        background: transparent;
        color: #3d3d3d;
        padding: 28px 12px 6px 12px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-family: 'Fredoka One', sans-serif;
        font-size: 28px;
        color: #3d3d3d;
        text-shadow: 0 2px 0 rgba(255,255,255,0.6);
      }

      main { max-width: 900px; margin: 12px auto; padding: 12px; }

      .section {
        background: var(--card);
        border-radius: 18px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      }

      .row { display:flex; gap:12px; align-items:center; }
      .col { flex:1; }

      input[type="file"]{ display:block; width:100%; padding:14px; border-radius:12px; border:2px dashed #ffe6d6; background:linear-gradient(90deg,#fffaf0,#fffdf7); }

      .big-note {
        height:140px; display:flex; align-items:center; justify-content:center; border-radius:14px; background: linear-gradient(180deg,#fff7f2,#fff6f6); font-size:48px; color:var(--accent);
        border: 2px solid rgba(255,107,107,0.12);
      }

      .btn { width:100%; min-height:54px; border-radius:12px; margin-top:8px; border:none; background:var(--accent); color:white; font-weight:700; font-size:16px; padding:12px; cursor:pointer; }
      .btn.secondary { background:var(--accent-2); }
      .btn:disabled { opacity:0.5; cursor:not-allowed; }

      #osmdOriginal, #osmdTransposed { width:100%; overflow-x:auto; border-radius:12px; background:#fff; padding:8px; border: 1px solid rgba(0,0,0,0.06); }
      #osmdOriginal, #osmdTransposed { -webkit-transform: translateZ(0); will-change: transform; }
      #osmdOriginal svg, #osmdTransposed svg { width:100% !important; height:auto !important; display:block; }

      .status { font-weight:700; color:var(--muted); }
      .log { white-space:pre-wrap; font-family:monospace; font-size:12px; color:#333; }

      #waveCanvas { width:100%; height:70px; border-radius:10px; background:linear-gradient(90deg,#fff0f0,#fffaf0); }

      .result-badge { padding:10px; border-radius:12px; display:inline-block; font-weight:700; }

      .confetti { pointer-events:none; position:fixed; left:0; top:0; width:100%; height:0; overflow:visible; z-index:9999; }
      .confetti span {
        position:absolute; font-size:28px; animation:fall 2s linear forwards; transform-origin:center; opacity:0.95;
      }
      @keyframes fall {
        0% { transform: translateY(-40px) rotate(0deg) scale(1); }
        100% { transform: translateY(110vh) rotate(720deg) scale(1.1); }
      }

      footer { text-align:center; color:rgba(0,0,0,0.45); font-size:12px; padding:8px; }
    </style>
  </head>

  <body>
    <header>
      <h1>🎉 Auto‑Chauffe Rigolote — v14</h1>
      <div style="font-size:13px; color:#5a5a5a; margin-top:6px">Amusons‑nous avec les jeunes cornistes — affichage adapté pour cor en Fa (sonne une quinte en dessous)</div>
    </header>

    <main>
      <section class="section">
        <div style="display:flex; gap:12px; align-items:center;">
          <div style="flex:0 0 110px;">
            <div class="big-note" id="bigNote">🎵</div>
          </div>
          <div style="flex:1">
            <input type="file" id="xmlInput" accept=".musicxml,.xml" />
            <div id="fileInfo" style="margin-top:8px; color:#444; font-weight:600"></div>
            <div id="osmdOriginal" style="margin-top:12px"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="row">
          <div class="col"><button id="startAudioBtn" class="btn">🎤 Démarrer l'écoute</button></div>
          <div class="col"><button id="stopAudioBtn" class="btn secondary" disabled>🛑 Arrêter</button></div>
        </div>
        <div style="display:flex; gap:12px; margin-top:12px; align-items:center;">
          <div style="flex:1">
            <div id="audioStatus" class="status">Micro: inactif</div>
            <canvas id="waveCanvas"></canvas>
          </div>
          <div style="flex:0 0 160px;">
            <div id="noteInfo" style="font-size:18px; font-weight:800; color:var(--accent);">Note: —</div>
            <div id="intervalInfo" style="margin-top:6px; color:#666; font-weight:700">Intervalle: —</div>
          </div>
        </div>
      </section>

      <section class="section">
        <button id="transposeBtn" class="btn" disabled>🎼 Transposer les notes (Magie)</button>
        <div id="resultInfo" style="margin-top:10px"></div>
        <div id="osmdTransposed" style="margin-top:12px"></div>
      </section>

      <section class="section">
        <div id="log" class="log"></div>
      </section>
    </main>

    <div class="confetti" id="confetti"></div>
    <footer>© Jouons Avec La Musique — Souris, chante et répète !</footer>

    <script>
      const logDiv = document.getElementById("log");
      function log(m) { logDiv.textContent += m + "\n"; }

      // Horn in F: sounding pitch is a perfect fifth (7 semitones) lower than written.
      const HORN_F_OFFSET = 7; // semitones to add to sounding pitch to get written pitch

      let osmdOriginal = null, osmdTransposed = null, xmlContent = null, firstNoteMidi = null;
      // lastDetected holds the last successfully-detected sounding pitch; we'll derive written pitch for display & transpose
      let lastDetectedSoundingMidi = null, lastDetectedWrittenMidi = null, lastDetectedDisplay = null;
      let playedNote = null, playedMidi = null, interval = 0;

      function mod(n, m) { return ((n % m) + m) % m; }

      function midiFromNote(s, a, o) {
        const v = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
        return 12 * (o + 1) + v[s] + a;
      }

      function noteFromMidi(m) {
        const n = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const x = n[mod(m, 12)];
        return { step: x[0], alter: x.includes("#") ? 1 : 0, octave: Math.floor(m / 12) - 1 };
      }

      function formatNoteFromMidi(midi) {
        const note = noteFromMidi(midi);
        return note.step + (note.alter ? '#' : '') + note.octave;
      }

      async function renderScore(id, xml) {
        const container = document.getElementById(id);
        if (!container) return null;
        container.innerHTML = '';
        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, { autoResize: true, drawingParameters: 'compacttight' });
        try {
          await osmd.load(xml);
          osmd.Zoom = window.innerWidth < 700 ? 0.55 : 0.9;
          osmd.render();
          requestAnimationFrame(() => {
            try { osmd.render(); } catch (e) {}
            setTimeout(() => { try { osmd.render(); } catch (e) {} }, 60);
          });
          const svg = container.querySelector('svg');
          if (svg) { svg.setAttribute('width', '100%'); svg.style.width = '100%'; svg.style.height = 'auto'; }
        } catch (err) {
          console.error('OSMD render failed:', err);
        }
        return osmd;
      }

      const xmlInput = document.getElementById('xmlInput');
      const fileInfo = document.getElementById('fileInfo');
      const transposeBtn = document.getElementById('transposeBtn');

      xmlInput.onchange = () => {
        const f = xmlInput.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = async (e) => {
          xmlContent = e.target.result;
          fileInfo.textContent = 'Partition chargée : ' + f.name;

          try {
            const xml = new DOMParser().parseFromString(xmlContent, 'application/xml');
            const note = Array.from(xml.querySelectorAll('note')).find((n) => n.querySelector('pitch'));
            if (note) {
              const p = note.querySelector('pitch');
              const step = p.querySelector('step') ? p.querySelector('step').textContent.trim() : null;
              const alterNode = p.querySelector('alter');
              const alter = alterNode ? parseInt(alterNode.textContent, 10) : 0;
              const octaveNode = p.querySelector('octave');
              const octave = octaveNode ? parseInt(octaveNode.textContent, 10) : 4;
              if (step) {
                firstNoteMidi = midiFromNote(step, alter, octave);
                log('Note de départ détectée (écrite) : ' + step + (alter ? '#' : '') + octave + ' (midi ' + firstNoteMidi + ')');
              }
            } else {
              firstNoteMidi = null;
              log('Aucune note avec pitch trouvée dans la partition.');
            }

            osmdOriginal = await renderScore('osmdOriginal', xmlContent);
            log('Partition affichée : ' + f.name);
            transposeBtn.disabled = !xmlContent || firstNoteMidi === null || !Number.isFinite(lastDetectedWrittenMidi);
          } catch (err) {
            log('Erreur lecture XML: ' + err);
            transposeBtn.disabled = true;
          }
        };
        r.readAsText(f);
      };

      window.addEventListener('resize', async () => { if (xmlContent) osmdOriginal = await renderScore('osmdOriginal', xmlContent); });

      let audioContext, analyser, mediaStream, audioInterval;

      // Improved autocorrelation: normalized, limited lag range, parabolic interpolation
      function autoCorrelate(buffer, sampleRate) {
        const SIZE = buffer.length;
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1;

        const r = new Float64Array(SIZE);
        for (let lag = 0; lag < SIZE; lag++) {
          let sum = 0;
          for (let i = 0; i < SIZE - lag; i++) sum += buffer[i] * buffer[i + lag];
          r[lag] = sum;
        }

        const r0 = r[0];
        if (r0 === 0) return -1;
        for (let i = 0; i < SIZE; i++) r[i] /= r0;

        const maxFreq = 1200, minFreq = 80;
        const minLag = Math.max(1, Math.floor(sampleRate / maxFreq));
        const maxLag = Math.min(SIZE - 1, Math.ceil(sampleRate / minFreq));

        let bestLag = -1, bestVal = 0.0;
        for (let lag = minLag; lag <= maxLag; lag++) { if (r[lag] > bestVal) { bestVal = r[lag]; bestLag = lag; } }
        if (bestLag <= 0) return -1;

        const x0 = bestLag - 1 >= 0 ? r[bestLag - 1] : 0;
        const x1 = r[bestLag];
        const x2 = bestLag + 1 < SIZE ? r[bestLag + 1] : 0;
        const denom = (x0 - 2 * x1 + x2);
        let shift = 0;
        if (denom !== 0) shift = (x0 - x2) / (2 * denom);
        const betterLag = bestLag + shift;
        const frequency = sampleRate / betterLag;
        if (!isFinite(frequency) || frequency <= 0) return -1;
        return frequency;
      }

      function freqToNoteName(freq) {
        const midi = Math.round(69 + 12 * Math.log2(freq / 440));
        const note = noteFromMidi(midi);
        return { midi, display: note.step + (note.alter ? '#' : '') + note.octave };
      }

      const waveCanvas = document.getElementById('waveCanvas');
      const waveCtx = waveCanvas.getContext && waveCanvas.getContext('2d');

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        waveCanvas.width = Math.round(waveCanvas.clientWidth * ratio);
        waveCanvas.height = Math.round(waveCanvas.clientHeight * ratio);
        if (waveCtx) waveCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const startAudioBtn = document.getElementById('startAudioBtn');
      const stopAudioBtn = document.getElementById('stopAudioBtn');
      const audioStatus = document.getElementById('audioStatus');
      const noteInfo = document.getElementById('noteInfo');
      const intervalInfo = document.getElementById('intervalInfo');
      const bigNote = document.getElementById('bigNote');

      startAudioBtn.onclick = async () => {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') await audioContext.resume();

          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioContext.createMediaStreamSource(mediaStream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          audioStatus.textContent = '🎧 Écoute en cours — chante fort !';
          startAudioBtn.disabled = true;
          stopAudioBtn.disabled = false;

          const buffer = new Float32Array(analyser.fftSize);
          audioInterval = setInterval(() => {
            analyser.getFloatTimeDomainData(buffer);

            if (waveCtx) {
              const w = waveCanvas.clientWidth;
              const h = waveCanvas.clientHeight;
              waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
              waveCtx.beginPath();
              waveCtx.lineWidth = 2;
              waveCtx.strokeStyle = 'rgba(255,107,107,0.9)';
              const step = Math.ceil(buffer.length / w);
              let x = 0;
              for (let i = 0; i < buffer.length; i += step) {
                const v = buffer[i] * 0.9;
                const y = (1 + v) / 2 * h;
                if (i === 0) waveCtx.moveTo(x, y);
                else waveCtx.lineTo(x, y);
                x++;
              }
              waveCtx.stroke();
            }

            const freq = autoCorrelate(buffer, audioContext.sampleRate);
            if (freq > 0) {
              const d = freqToNoteName(freq);
              playedNote = d.display;
              playedMidi = d.midi;
              // convert sounding pitch (playedMidi) to written pitch for horn in F
              lastDetectedSoundingMidi = playedMidi;
              lastDetectedWrittenMidi = playedMidi + HORN_F_OFFSET;
              lastDetectedDisplay = formatNoteFromMidi(lastDetectedWrittenMidi);
            }

            // display the last detected written note (if any)
            const displayNote = lastDetectedDisplay ? lastDetectedDisplay : '—';
            noteInfo.textContent = 'Note: ' + displayNote;
            bigNote.textContent = lastDetectedDisplay ? (lastDetectedDisplay + ' 🎶') : '🎵';

            if (firstNoteMidi !== null && Number.isFinite(lastDetectedWrittenMidi)) {
              interval = lastDetectedWrittenMidi - firstNoteMidi;
              intervalInfo.textContent = 'Intervalle: ' + interval + ' demi-tons';
              transposeBtn.disabled = false;
            } else if (firstNoteMidi !== null) {
              intervalInfo.textContent = 'Intervalle: —';
              transposeBtn.disabled = true;
            } else {
              intervalInfo.textContent = 'Intervalle: Partition sans note de départ';
              transposeBtn.disabled = true;
            }

          }, 160);
        } catch (err) {
          log('Erreur audio: ' + err);
          audioStatus.textContent = 'Micro: erreur';
          startAudioBtn.disabled = false;
          stopAudioBtn.disabled = true;
        }
      };

      stopAudioBtn.onclick = () => {
        if (audioInterval) clearInterval(audioInterval);
        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
        if (audioContext) audioContext.close();
        audioStatus.textContent = 'Micro: inactif';
        startAudioBtn.disabled = false;
        stopAudioBtn.disabled = true;
        // keep lastDetected displayed after stopping
        transposeBtn.disabled = !xmlContent || firstNoteMidi === null || !Number.isFinite(lastDetectedWrittenMidi);
      };

      function showerConfetti() {
        const el = document.getElementById('confetti');
        el.innerHTML = '';
        const emojis = ['🎉', '🎈', '✨', '🎵', '🦄', '😄'];
        for (let i = 0; i < 30; i++) {
          const s = document.createElement('span');
          s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          s.style.left = (Math.random() * 100) + '%';
          s.style.top = (Math.random() * 10) + 'vh';
          s.style.fontSize = (16 + Math.random() * 20) + 'px';
          s.style.animationDelay = (Math.random() * 0.6) + 's';
          el.appendChild(s);
          setTimeout(() => s.remove(), 2600);
        }
      }

      transposeBtn.onclick = async () => {
        if (!xmlContent) { log('Aucune partition chargée.'); return; }
        if (firstNoteMidi === null) { log('Impossible : aucune note de départ détectée.'); return; }
        if (lastDetectedWrittenMidi === null) { log('Impossible : aucune note jouée détectée.'); return; }

        const xmlDoc = new DOMParser().parseFromString(xmlContent, 'application/xml');
        const notes = xmlDoc.querySelectorAll('note');
        const order = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const firstStep = noteFromMidi(firstNoteMidi).step;
        const playedStep = noteFromMidi(lastDetectedWrittenMidi).step;

        let diatonicShift = (order.indexOf(playedStep) - order.indexOf(firstStep) + 7) % 7;
        if (diatonicShift === 0 && lastDetectedWrittenMidi !== firstNoteMidi) diatonicShift = 1;

        notes.forEach((note) => {
          const pitch = note.querySelector('pitch'); if (!pitch) return;
          const stepNode = pitch.querySelector('step'); const octaveNode = pitch.querySelector('octave');
          if (!stepNode || !octaveNode) return;

          const oldStep = stepNode.textContent.trim();
          const oldOctave = parseInt(octaveNode.textContent, 10);
          const alterNode = pitch.querySelector('alter');
          const oldAlter = alterNode ? parseInt(alterNode.textContent, 10) : 0;

          const midiOld = midiFromNote(oldStep, oldAlter, oldOctave);
          const midiTarget = midiOld + interval;
          const newStep = order[(order.indexOf(oldStep) + diatonicShift) % 7];

          let bestOct = oldOctave; let bestDiff = Infinity;
          for (let o = oldOctave - 2; o <= oldOctave + 2; o++) {
            const candidate = midiFromNote(newStep, 0, o);
            const diff = Math.abs(candidate - midiTarget);
            if (diff < bestDiff) { bestDiff = diff; bestOct = o; }
          }

          const base = midiFromNote(newStep, 0, bestOct);
          let newAlter = midiTarget - base;
          if (newAlter > 2) { while (newAlter > 2) { bestOct += 1; newAlter = midiTarget - midiFromNote(newStep, 0, bestOct); } }
          else if (newAlter < -2) { while (newAlter < -2) { bestOct -= 1; newAlter = midiTarget - midiFromNote(newStep, 0, bestOct); } }

          stepNode.textContent = newStep; octaveNode.textContent = String(bestOct);
          if (newAlter !== 0) {
            if (!alterNode) { const newAlterNode = xmlDoc.createElement('alter'); newAlterNode.textContent = String(newAlter); pitch.appendChild(newAlterNode); }
            else { alterNode.textContent = String(newAlter); }
          } else if (alterNode) { alterNode.parentNode.removeChild(alterNode); }
        });

        const xmlT = new XMLSerializer().serializeToString(xmlDoc);
        osmdTransposed = await renderScore('osmdTransposed', xmlT);
        resultInfo.innerHTML = '<span class="result-badge">✅ Transposition réussie ! Bravo 🎊</span>';
        showerConfetti();
        log('Transposition effectuée (V14) — intervalle : ' + interval + ' demi-tons (pour cor en Fa)');
      };
    </script>
  </body>
</html>
